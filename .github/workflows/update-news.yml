name: Update news feeds
on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'sources.json'
      - 'fetch_news.py'
      - '.github/workflows/update-news.yml'
concurrency:
  group: news-feed-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch RSS, Atom and video feeds
        run: python fetch_news.py
      - name: Send push notifications for new articles
        env:
          CF_PUSH_TOKEN: ${{ secrets.CF_PUSH_TOKEN }}
        run: |
          COUNT=$(python -c "import json; print(len(json.load(open('news.json', encoding='utf-8')).get('new_articles', [])))")
          if [ "$COUNT" -gt 0 ] && [ -n "$CF_PUSH_TOKEN" ]; then
            python -c "import json; d=json.load(open('news.json', encoding='utf-8')); print(json.dumps({'articles':d.get('new_articles', [])}, ensure_ascii=False))" > /tmp/new-articles.json
            curl --fail-with-body --silent --show-error https://akhbar-blaharaa.pages.dev/api/notify -H "Authorization: Bearer $CF_PUSH_TOKEN" -H 'Content-Type: application/json' --data-binary @/tmp/new-articles.json
          else
            echo "No new articles or CF_PUSH_TOKEN is not configured."
          fi
      - name: Commit updated news file if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add news.json
          if git diff --cached --quiet; then
            echo "No news data changes."
          else
            git commit -m 'Update news feed data'
            git pull --rebase origin main
            git push
          fi
